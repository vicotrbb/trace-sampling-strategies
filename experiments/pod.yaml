apiVersion: v1
kind: Namespace
metadata:
  name: trace-sampling-study-20260923
  labels:
    purpose: trace-sampling-paper
---
apiVersion: v1
kind: Pod
metadata:
  name: study-runner
  namespace: trace-sampling-study-20260923
  labels:
    app: trace-sampling-study
spec:
  nodeSelector:
    kubernetes.io/hostname: homelab-01
  restartPolicy: Never
  terminationGracePeriodSeconds: 30
  containers:
    - name: runner
      image: python:3.12.10-slim@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db
      command: ["python", "-c", "import time; time.sleep(86400)"]
      env:
        - name: STUDY_CONTEXT
          value: homelab
        - name: PYTHONUNBUFFERED
          value: "1"
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "2"
          memory: "1536Mi"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: work
          mountPath: /work
  volumes:
    - name: scripts
      configMap:
        name: study-scripts
    - name: work
      emptyDir:
        sizeLimit: 5Gi
